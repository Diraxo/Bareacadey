<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sign The Document</title>
  </head>
  <body style="background-color: #f2f2f2; padding: 50px; font-family: Arial, sans-serif;">
    <div style="background-color: white; padding: 40px; margin: 50px auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; width: 500px;">
      <img src="{{companyLogo}}" style="margin-bottom: 30px; height: 70px">
      <h1 style="margin: 0; font-family: 'Roboto', sans-serif;">Sign The Document</h1>
      <p style="font-size: 18px; margin: 20px 0 50px 0;">
          Dear {{username}}, you've been requested to sign a document. Please follow the link below to review and sign the document:
      </p>
      <a href="{{verificationLink}}" style="background-color: #0077c9; color: white; padding: 15px 20px; border-radius: 5px; text-decoration: none; font-family: 'Roboto', sans-serif;">Sign Document</a>
      <p style="margin: 50px 0 0 0; font-size: 14px;">If you have any questions or concerns about the document, please contact us.</p>
  </div>
  </body>
</html>
