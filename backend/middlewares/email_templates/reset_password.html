<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reset Your Password</title>
  </head>
  <body style="background-color: #f2f2f2; padding: 50px; font-family: Arial, sans-serif;">
    <div style="background-color: white; padding: 40px; margin: 50px auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; width: 500px;">
      <img src="{{companyLogo}}" style="margin-bottom: 50px; width: 90%">
      <h1 style="margin: 0; font-family: 'Roboto', sans-serif;">Reset Your Password</h1>
      <p style="font-size: 18px; margin: 20px 0 50px 0;">
          Dear {{username}}, you've requested to reset your password. Please follow the link below to create a new password:
      </p>
      <a href="{{verificationLink}}" style="background-color: #0077c9; color: white; padding: 15px 20px; border-radius: 5px; text-decoration: none; font-family: 'Roboto', sans-serif;">Reset Password</a>
      <p style="margin: 50px 0 0 0; font-size: 14px;">If you didn't request this password reset, please ignore this email.</p>
  </div>
  </body>
</html>
